# Workflow: build JSON cho app native (native/README.md)
# Đặt tại .github/workflows/build-reports.yml. Các bước nằm trong native/ci/run.sh
# (sửa quy trình chỉ cần sửa run.sh, không phải dán lại file này).
# JSON nằm ở branch `reports`. Không đụng tới Streamlit Cloud (chạy theo main như cũ).
name: Build native reports

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'App.py'
      - 'native/pipeline/**'
      - 'native/app/lib/logic/**'
      - 'native/ci/**'
      - '.github/workflows/build-reports.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-reports
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Cùng requirements.txt với Streamlit Cloud → cùng phiên bản pandas/plotly/altair
      - name: Install Python deps
        run: pip install -r requirements.txt beautifulsoup4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Xuất + đối chiếu + publish
        run: bash native/ci/run.sh
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
