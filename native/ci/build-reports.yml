# Workflow: build JSON cho app native (native/README.md)
# Bản gốc của .github/workflows/build-reports.yml (token của máy không có quyền sửa workflow →
# dán file này vào GitHub web). Các bước nằm trong native/ci/*.sh — sửa quy trình không cần dán lại.
# Lượt 1 chia cho 4 máy chạy song song (shard.sh) → job publish ghép lại, đưa lên app ngay,
# rồi mới đối chiếu + lượt 2 + lượt 3 (run.sh). JSON nằm ở branch `reports`.
name: Build native reports

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'App.py'
      - 'native/pipeline/**'
      - 'native/app/lib/logic/**'
      - 'native/ci/**'
      - '.github/workflows/build-reports.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-reports
  cancel-in-progress: true

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # Cùng requirements.txt với Streamlit Cloud → cùng phiên bản pandas/plotly/altair
      - run: pip install -r requirements.txt beautifulsoup4
      - name: Lượt 1 (phần của máy ${{ matrix.shard }})
        run: bash native/ci/shard.sh ${{ matrix.shard }} 4
        env:
          REPO: ${{ github.repository }}
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: _shard
          retention-days: 1

  build:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python deps
        run: pip install -r requirements.txt beautifulsoup4
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: _shards
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ghép + publish + đối chiếu + lượt 2, 3
        run: bash native/ci/run.sh
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
