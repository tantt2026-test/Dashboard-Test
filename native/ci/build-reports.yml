# Workflow: build JSON cho app native (native/README.md)
# Đặt tại .github/workflows/build-reports.yml. Mỗi lần Onetech sync push data / sửa App.py:
#   Lượt 1 (nhanh): Turnover + 18 báo cáo KPI ngày mặc định → đối chiếu số → publish
#   Lượt 2: các ngày cũ trong tháng → publish lại
# JSON nằm ở branch `reports`. Không đụng tới Streamlit Cloud (chạy theo main như cũ).
name: Build native reports

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'App.py'
      - 'native/pipeline/**'
      - 'native/app/lib/logic/**'
      - '.github/workflows/build-reports.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-reports
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Cùng requirements.txt với Streamlit Cloud → cùng phiên bản pandas/plotly/altair
      - name: Install Python deps
        run: pip install -r requirements.txt beautifulsoup4

      - name: Lấy bản reports trước (dùng lại ngày/tháng không đổi)
        run: git clone -q --depth 1 -b reports "https://github.com/${{ github.repository }}.git" _prev || mkdir -p _prev

      - name: "Lượt 1: Turnover + KPI ngày mặc định"
        run: |
          python native/pipeline/export_reports.py --app App.py --out _reports \
            --kpi --kpi-mode default --prev _prev --workers 4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Đối chiếu số App (Dart) vs Streamlit (Python)
        run: |
          (cd native/app && flutter pub get)
          python native/pipeline/parity_check.py --app App.py --json _reports \
            --dart-app native/app --combos 5

      - name: Publish lượt 1
        run: bash native/ci/publish.sh _reports "Lượt 1 từ ${GITHUB_SHA::7}"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}

      - name: "Lượt 2: các ngày cũ trong tháng"
        run: |
          python native/pipeline/export_reports.py --app App.py --out _reports \
            --kpi --kpi-mode history --prev _reports --workers 4

      - name: Publish lượt 2
        run: bash native/ci/publish.sh _reports "Đầy đủ từ ${GITHUB_SHA::7}"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
