# Workflow: build JSON cho app native (native/README.md)
# ƒê·∫∑t t·∫°i .github/workflows/build-reports.yml. C√°c b∆∞·ªõc n·∫±m trong native/ci/run.sh
# (s·ª≠a quy tr√¨nh ch·ªâ c·∫ßn s·ª≠a run.sh, kh√¥ng ph·∫£i d√°n l·∫°i file n√†y).
# JSON n·∫±m ·ªü branch `reports`. Kh√¥ng ƒë·ª•ng t·ªõi Streamlit Cloud (ch·∫°y theo main nh∆∞ c≈©).
name: Build native reports

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'App.py'
      - 'native/pipeline/**'
      - 'native/app/lib/logic/**'
      - 'native/ci/**'
      - '.github/workflows/build-reports.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-reports
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # C√πng requirements.txt v·ªõi Streamlit Cloud ‚Üí c√πng phi√™n b·∫£n pandas/plotly/altair
      - name: Install Python deps
        run: pip install -r requirements.txt beautifulsoup4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Xu·∫•t + ƒë·ªëi chi·∫øu + publish
        run: bash native/ci/run.sh
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
