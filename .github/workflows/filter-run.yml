# Đặt tại .github/workflows/filter-run.yml — app native gọi khi cần tính lại 1 tổ hợp bộ lọc
# (chạy App.py đúng commit dữ liệu app đang xem, lưu kết quả vào branch `filters`).
name: Filter run (app)

on:
  workflow_dispatch:
    inputs:
      req:
        description: 'JSON yêu cầu (month_key, date, code, name, nav, ddkd, values, sc)'
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(inputs.req).sc }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt beautifulsoup4
      - name: Tính + lưu
        run: bash native/ci/filter_run.sh
        env:
          REQ: ${{ inputs.req }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
